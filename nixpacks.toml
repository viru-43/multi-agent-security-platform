[phases.setup]
nixPkgs = ["nodejs_20", "python313", "python313Packages.pip", "git"]

[phases.install]
cmds = [
    "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"
]

[start]
cmd = "uvicorn orchestrator.main:app --host 0.0.0.0 --port $PORT"

[variables]
NODE_PATH = "/root/.nix-profile/bin"
NIXPACKS_PATH = "/opt/venv/bin"